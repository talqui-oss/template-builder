name: Adapter request
description: Ask for support for another messaging provider
labels: [adapter]
body:
  - type: input
    id: provider
    attributes:
      label: Provider
      placeholder: "Example: Gupshup, 360dialog, Infobip"
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to the provider's template creation API
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I can open a pull request"
        - "No, just requesting"
