name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@talqui-oss/template-builder@0.1.0"
    validations:
      required: true
  - type: textarea
    id: template
    attributes:
      label: Template JSON
      description: The smallest template that reproduces the problem. Remove any personal data.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include error messages or the provider response.
    validations:
      required: true
